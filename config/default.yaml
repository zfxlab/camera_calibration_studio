%YAML:1.0
capture:
  output_directory: "sessions"
  exposure_time_us: 10000.0
  gain: 0.0
  frame_rate: 10.0
  sdk_buffer_count: 4
  recording_rate_hz: 3.0
focus:
  processing_rate_hz: 10.0
  smoothing_alpha: 0.20
  default_roi_fraction: 0.30
  dark_threshold: 10
  bright_threshold: 245
  clipping_warning_ratio: 0.05
mono_target:
  type: "symmetric_circles"
  columns: 7
  rows: 7
  spacing_m: 0.03
stereo_target:
  dictionary: "DICT_6X6_50"
  marker_ids: [1, 2, 3, 4]
  marker_length_m: 0.20
  center_spacing_x_m: 1.10
  center_spacing_y_m: 0.70
